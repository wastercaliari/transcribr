# Configuração canônica do Prometheus para o ecossistema TranscriBR (SCRUM-64)
global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: 'transcribr'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'host.docker.internal:8080'
          - 'localhost:8080'
          - 'transcribr:8080'
        labels:
          environment: 'production'
          service: 'transcribr-core'

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus-internal'
